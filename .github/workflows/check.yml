name: Check

# Every gate, no build, on every commit: lockfile, lint, format, pyright,
# the suppression ratchet and the test suite — `make check`.
#
# Hosted Ubuntu, always on, billed at 1x: the free minutes ran out once
# because the macOS and Windows *builds* are long and bill at 10x and 2x,
# so those stay on the self-hosted machines, and the developer's Mac is not
# used for the checks.
#
# The installers are built by build-macos.yml / build-windows.yml on a
# version tag; they run `make check` again before building.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch supersedes a run still queued or going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # What PySide6 needs to load with the offscreen platform (the tests
      # set QT_QPA_PLATFORM themselves): no display, but the libraries
      # Qt links against still have to be there.
      # libpulse0: Qt's audio module loads it.
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3 libpulse0

      # The dev extra only: torch (build extra) would pull CUDA wheels here.
      - name: make check
        run: make check EXTRAS="--extra dev"

